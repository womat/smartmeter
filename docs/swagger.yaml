definitions:
  health.Model:
    properties:
      app:
        description: Application name (MODULE)
        type: string
      appVersion:
        description: Current version of the application
        type: string
      goVersion:
        description: Go runtime version
        type: string
      heapAllocBytes:
        description: Allocated heap memory in bytes
        type: integer
      hostname:
        description: Machine name where the app runs
        type: string
      meters:
        additionalProperties:
          $ref: '#/definitions/meters.MeterStatus'
        description: |-
          Meters holds the diagnostic state per meter name: unit IDs, the last valid snapshot,
          the last error and the snapshots discarded as implausible. Filled in by the caller.
        type: object
      numGoroutines:
        description: Current number of active goroutines
        type: integer
      os:
        description: Operating system name
        type: string
      rtu:
        description: |-
          RTU is the state of the serial port towards the inverter, empty without RTU listener.
          Filled in by the caller.
        items:
          $ref: '#/definitions/meters.SerialStatus'
        type: array
      sysMemoryBytes:
        description: Total memory obtained from the OS
        type: integer
      timestamp:
        description: UTC timestamp when health info was collected (RFC3339)
        type: string
      uptimeSeconds:
        description: Application uptime in seconds
        type: number
    type: object
  meters.MeterStatus:
    properties:
      ageSeconds:
        description: Age of the served values
        type: number
      discardedSnapshots:
        description: Snapshots discarded as implausible
        type: integer
      lastError:
        description: Last failed or discarded poll
        type: string
      lastErrorTime:
        description: Time of LastError
        type: string
      lastSuccess:
        description: Last valid snapshot from the source
        type: string
      ready:
        description: Values are current, see staleAfter
        type: boolean
      unitIDs:
        description: 'Unit IDs the meter answers on (int: []uint8 would be base64
          in JSON)'
        items:
          type: integer
        type: array
    type: object
  meters.SerialStatus:
    properties:
      connected:
        type: boolean
      error:
        type: string
      port:
        type: string
      since:
        type: string
    type: object
  web.ApiError:
    properties:
      error:
        type: string
    type: object
info:
  contact: {}
paths:
  /health:
    get:
      description: Retrieves memory usage, goroutine count, version, hostname, Go
        runtime version, OS, per meter the unit IDs, the time and age of the last
        valid snapshot, the last error and the snapshots discarded as implausible,
        and the state of the RTU port.
      produces:
      - application/json
      responses:
        "200":
          description: Health data successfully retrieved
          schema:
            $ref: '#/definitions/health.Model'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/web.ApiError'
      security:
      - ApiKeyAuth: []
      summary: Get health data
      tags:
      - info
  /ready:
    get:
      description: Returns 200 while every meter serves current values and the RTU
        port is available, 503 while a meter has delivered no valid snapshot for three
        poll intervals or the RTU port is not available. No authentication required.
      produces:
      - application/json
      responses:
        "200":
          description: Application is ready
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Values of a meter are outdated
          schema:
            $ref: '#/definitions/web.ApiError'
      summary: Readiness check
      tags:
      - info
  /version:
    get:
      description: Returns the current application name and version. No authentication
        required.
      produces:
      - application/json
      responses:
        "200":
          description: Application version and name
          schema:
            properties:
              app:
                type: string
              appVersion:
                type: string
            type: object
      summary: Get application version and name
      tags:
      - info
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: X-API-Key
    type: apiKey
swagger: "2.0"
