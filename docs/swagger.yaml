definitions:
  health.Model:
    properties:
      app:
        description: Application name (MODULE)
        type: string
      appVersion:
        description: Current version of the application
        type: string
      goVersion:
        description: Go runtime version
        type: string
      heapAllocBytes:
        description: Allocated heap memory in bytes
        type: integer
      hostname:
        description: Machine name where the app runs
        type: string
      meters:
        additionalProperties:
          $ref: '#/definitions/meters.MeterStatus'
        description: |-
          Meters holds the diagnostic state per meter name: unit IDs, the last valid snapshot,
          the last error and the snapshots discarded as implausible. Filled in by the caller.
        type: object
      modbus:
        allOf:
        - $ref: '#/definitions/meters.Activity'
        description: |-
          Modbus describes the listeners towards the inverter and the TCP clients and counts the
          requests they answered. Filled in by the caller.
      numGoroutines:
        description: Current number of active goroutines
        type: integer
      os:
        description: Operating system name
        type: string
      rtu:
        description: |-
          RTU is the state of the serial port towards the inverter, empty without RTU listener.
          Filled in by the caller.
        items:
          $ref: '#/definitions/meters.SerialStatus'
        type: array
      sysMemoryBytes:
        description: Total memory obtained from the OS
        type: integer
      timestamp:
        description: UTC timestamp when health info was collected (RFC3339)
        type: string
      uptimeSeconds:
        description: Application uptime in seconds
        type: number
    type: object
  meters.Activity:
    properties:
      rtu:
        allOf:
        - $ref: '#/definitions/meters.RTUActivity'
        description: nil without RTU listener
      tcp:
        allOf:
        - $ref: '#/definitions/meters.TCPActivity'
        description: nil without TCP listener
    type: object
  meters.LimitsConfig:
    properties:
      current:
        description: A per phase, default maxCurrent or 63
        type: number
      exportPower:
        description: W fed into the grid at most, default 3 x 230 V x current
        type: number
      importPower:
        description: W drawn from the grid at most, default 3 x 230 V x current
        type: number
    type: object
  meters.MeterStatus:
    properties:
      ageSeconds:
        description: Age of the served values
        type: number
      discardedSnapshots:
        description: Snapshots discarded as implausible
        type: integer
      lastError:
        description: Last failed or discarded poll
        type: string
      lastErrorTime:
        description: Time of LastError
        type: string
      lastSuccess:
        description: Last valid snapshot from the source
        type: string
      latencyMs:
        description: Duration of the last successful read of the source
        type: number
      limits:
        allOf:
        - $ref: '#/definitions/meters.LimitsConfig'
        description: Scale of the web page
      maxCurrent:
        description: A per phase, plausibility check
        type: number
      offlineSince:
        description: When the unit IDs went silent after staleTimeout
        type: string
      online:
        description: The unit IDs answer, see staleTimeout
        type: boolean
      pollIntervalSeconds:
        description: Poll interval of the source
        type: number
      polls:
        description: Successful polls since start
        type: integer
      ready:
        description: Values are current, see staleAfter
        type: boolean
      source:
        description: Upstream meter, e.g. "tcp 192.168.1.10:502 unit 1"
        type: string
      staleTimeoutSeconds:
        description: 0 = the unit IDs never go silent
        type: number
      unitIDs:
        description: 'Unit IDs the meter answers on (int: []uint8 would be base64
          in JSON)'
        items:
          type: integer
        type: array
      values:
        additionalProperties:
          format: float64
          type: number
        description: Values are the canonical fields of the last valid snapshot, as
          served on the unit IDs.
        type: object
    type: object
  meters.RTUActivity:
    properties:
      line:
        description: e.g. 9600 8N1
        type: string
      port:
        description: e.g. /dev/ttyS0
        type: string
      requests:
        description: answered since start
        type: integer
    type: object
  meters.RegisterDump:
    properties:
      online:
        description: 'false: the unit ID does not answer, see staleTimeout'
        type: boolean
      proprietary:
        description: Fronius RS485 map, read by the inverter
        items:
          $ref: '#/definitions/meters.RegisterRow'
        type: array
      sunspec:
        description: SunSpec models 1 and 203, read by wallboxes and evcc
        items:
          $ref: '#/definitions/meters.RegisterRow'
        type: array
      unitID:
        type: integer
    type: object
  meters.RegisterRow:
    properties:
      addr:
        type: integer
      field:
        description: canonical field, empty for a fixed value
        type: string
      raw:
        description: registers, high word first
        items:
          type: integer
        type: array
      sf:
        description: value = raw * 10^sf
        type: integer
      text:
        description: decoded string
        type: string
      type:
        description: uint16 | int16 | uint32 | int32 | float32 | string
        type: string
      value:
        description: decoded value, 0 for strings
        type: number
    type: object
  meters.SerialStatus:
    properties:
      connected:
        type: boolean
      error:
        type: string
      port:
        type: string
      since:
        type: string
    type: object
  meters.TCPActivity:
    properties:
      address:
        description: host:port
        type: string
      clients:
        description: connected right now
        type: integer
      requests:
        description: answered since start
        type: integer
    type: object
  web.ApiError:
    properties:
      error:
        type: string
    type: object
info:
  contact: {}
paths:
  /health:
    get:
      description: Retrieves memory usage, goroutine count, version, hostname, Go
        runtime version, OS, per meter the unit IDs, the source, the served values,
        the time, age and read duration of the last valid snapshot, whether the unit
        IDs answer, the last error, the snapshots discarded as implausible and the
        limits for the web page, the state of the RTU port and the Modbus listeners
        with their request counters.
      produces:
      - application/json
      responses:
        "200":
          description: Health data successfully retrieved
          schema:
            $ref: '#/definitions/health.Model'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/web.ApiError'
      security:
      - ApiKeyAuth: []
      summary: Get health data
      tags:
      - info
  /ready:
    get:
      description: Returns 200 while every meter serves current values and the RTU
        port is available, 503 while a meter has delivered no valid snapshot for three
        poll intervals or the RTU port is not available. No authentication required.
      produces:
      - application/json
      responses:
        "200":
          description: Application is ready
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Values of a meter are outdated
          schema:
            $ref: '#/definitions/web.ApiError'
      summary: Readiness check
      tags:
      - info
  /registers:
    get:
      description: Returns the proprietary Fronius map (read by the inverter) and
        the SunSpec block (read by wallboxes and evcc) of a unit ID, each register
        with address, canonical field, type, scale factor, raw words and decoded value,
        from one consistent copy.
      parameters:
      - description: Unit ID (1-247)
        in: query
        name: unit
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Registers of the unit ID
          schema:
            $ref: '#/definitions/meters.RegisterDump'
        "400":
          description: Invalid unit ID
          schema:
            $ref: '#/definitions/web.ApiError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/web.ApiError'
        "404":
          description: No meter answers on this unit ID
          schema:
            $ref: '#/definitions/web.ApiError'
      security:
      - ApiKeyAuth: []
      summary: Get the registers of a unit ID
      tags:
      - meters
  /version:
    get:
      description: Returns the current application name and version. No authentication
        required.
      produces:
      - application/json
      responses:
        "200":
          description: Application version and name
          schema:
            properties:
              app:
                type: string
              appVersion:
                type: string
            type: object
      summary: Get application version and name
      tags:
      - info
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: X-API-Key
    type: apiKey
swagger: "2.0"
