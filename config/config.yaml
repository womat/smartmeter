# =============================================================================
# app configuration
# =============================================================================

# logLevel defines the minimum log level.
# Messages with at least this level are logged.
# Allowed values: debug | info | warn | error
logLevel: info

# logDestination defines where logs are written to.
# Supported values: stdout | stderr | /path/to/logfile
logDestination: stdout

# environment: dev | prod
env: dev


# =============================================================================
# Webserver configuration (HTTPS)
# =============================================================================
webserver:
  # Host address the HTTPS server listens on (0.0.0.0 = all interfaces)
  listenHost: 0.0.0.0

  # Port the HTTPS server listens on
  listenPort: 8443

  # Global API key for protected endpoints
  apiKey: changeme!

  # TLS private key file
  keyFile: /opt/smartmeteremu/etc/key.pem

  # TLS certificate file
  certFile: /opt/smartmeteremu/etc/cert.pem

  # Blocked IP addresses or networks (empty = none blocked)
  # Examples: 192.168.0.1, 192.168.0.0/16, 10.0.0.0/8
  blockedIPs: []
  #  - 192.168.0.1
  #  - 192.168.0.0/16

  # Allowed IP addresses or networks (empty = all allowed)
  # Note: ::1 is the IPv6 loopback address
  # Examples: 127.0.0.1, ::1, 192.168.0.0/16
  allowedIPs: []
  #  - 127.0.0.1
  #  - ::1
  #  - 192.168.0.0/16

# =============================================================================
# Fronius Smart Meter Emulator — Konfiguration
# =============================================================================
#
# Diese Datei beschreibt ausschließlich:
#   1. Wie der Emulator nach außen antwortet (listen)
#   2. Woher die Messwerte kommen (source pro device)
#   3. Wie Quellregister auf kanonische Felder gemappt werden (map)
#
# Was NICHT hier konfiguriert wird:
#   - Fronius-Zielregister        → hardcoded im Code
#   - Identifikationsregister     → hardcoded im Code
#
# =============================================================================
# Kanonische Felder
# =============================================================================
#
#   PFLICHT — müssen pro Device gemappt sein:
#     power_total       Wirkleistung gesamt         [W]    signed float
#     power_l1          Wirkleistung Phase 1         [W]    signed float
#     power_l2          Wirkleistung Phase 2         [W]    signed float
#     power_l3          Wirkleistung Phase 3         [W]    signed float
#     voltage_l1        Spannung Phase 1–N           [V]
#     voltage_l2        Spannung Phase 2–N           [V]
#     voltage_l3        Spannung Phase 3–N           [V]
#     current_l1        Strom Phase 1                [A]    signed float
#     current_l2        Strom Phase 2                [A]    signed float
#     current_l3        Strom Phase 3                [A]    signed float
#     energy_import     Bezugsenergie gesamt         [Wh]
#     energy_export     Einspeiseenergie gesamt      [Wh]
#     frequency         Netzfrequenz                 [Hz]
#
#   OPTIONAL — Defaultwert 1.0 wenn nicht angegeben:
#     pf_l1             Leistungsfaktor Phase 1      [-1.0 .. 1.0]
#     pf_l2             Leistungsfaktor Phase 2      [-1.0 .. 1.0]
#     pf_l3             Leistungsfaktor Phase 3      [-1.0 .. 1.0]
#
# =============================================================================
# Mapping-Typen (type:)
# =============================================================================
#
#   register  Wert wird aus Quellregister gelesen
#   fixed     Fixer Wert, kein Quellzähler nötig
#   expr      Berechnung aus anderen kanonischen Feldern
#             Syntax: "${field1} + ${field2} * 0.5"
#             Operatoren: + - * /  und Klammerung
#             Hinweis: referenzierte Felder müssen im selben Device definiert sein
#
# Für type: register
#   address     Startadresse im Quellzähler (0-basiert)
#   dtype       uint16 | uint32 | uint64 | int16 | int32 | int64 | float32
#   byte_order  big | little                              (default: big)
#   word_order  big | little  (nur bei 32/64 bit)         (default: big)
#   scale       Exponent: Realwert = (Rohwert + offset) * 10^scale  (default: 0)
#   offset      Additiver Offset auf Rohwert vor Skalierung          (default: 0)
#
# =============================================================================

# -----------------------------------------------------------------------------
# listen — Modbus-Server nach außen
# RTU und TCP können gleichzeitig aktiv sein.
# -----------------------------------------------------------------------------
listen:
  tcp:
    enabled: true
    host: "0.0.0.0"
    port: 502
  rtu:
    enabled: false
    port: "/dev/ttyUSB0"
    baud_rate: 9600
    data_bits: 8
    parity: "N"             # N=none  E=even  O=odd
    stop_bits: 1

# -----------------------------------------------------------------------------
# devices — Liste der emulierten Smart Meter
# Jeder Eintrag ist ein eigenständiger Modbus-Slave.
# -----------------------------------------------------------------------------
devices:
  # ---------------------------------------------------------------------------
  # Device 1: Hauptzähler — Quellzähler via Modbus RTU
  # ---------------------------------------------------------------------------
  - name: "main_meter"
    unitId: 200

    # -------------------------------------------------------------------------
    # source — Upstream-Verbindung zum echten Zähler
    # -------------------------------------------------------------------------
    source:
      type: rtu             # rtu | tcp
      unitId: 1
      timeout: "2s"
      rtu:
        port: "/dev/ttyUSB1"
        baud_rate: 9600
        data_bits: 8
        parity: "N"
        stop_bits: 1
      # tcp:
      #   host: "192.168.1.100"
      #   port: 502

    # -------------------------------------------------------------------------
    # poll — Leseintervall und Blockbildung
    # -------------------------------------------------------------------------
    poll:
      interval: "1s"
      max_block_gap: 4      # Max. Lücke (Register) innerhalb eines Leseblocks
      max_block_size: 125   # Max. Registerzahl pro Leseblock (Modbus-Limit 125)

    # -------------------------------------------------------------------------
    # map — kanonisches Feld als Schlüssel, Mapping-Definition als Wert
    # -------------------------------------------------------------------------
    map:
      device_id:
        type: fixed
        value: 285
      firmware:
        type: fixed
        value: 1.17
      serial_number:
        type: fixed
        value: 99999999
      serial_string:

      voltage_l1_n:
        type: register
        address: 52
        dtype: uint16
        byte_order: big
        scale: -1             # Rohwert 2300 → 230.0 V
      voltage_l2_n:
        type: register
        address: 54
        dtype: uint16
        byte_order: big
        scale: -1
      voltage_l3_n:
        type: register
        address: 56
        dtype: uint16
        byte_order: big
        scale: -1
      voltage_l1_l2:
        type: expr
        expr: "${voltage_l1_n} * 1.732050807568877"
      voltage_l1_l3:
        type: expr
        expr: "${voltage_l1_n} * SQRT(3)"
      voltage_l2_l3:
        type: expr
        expr: "${voltage_l2_n} * SQRT(3)"

      current_l1:
        type: register
        address: 58
        dtype: uint32
        byte_order: big
        word_order: big
        scale: -3             # Rohwert 15230 → 15.230 A
      current_l2:
        type: register
        address: 62
        dtype: uint32
        byte_order: big
        word_order: big
        scale: -3
      current_l3:
        type: register
        address: 66
        dtype: uint32
        byte_order: big
        word_order: big
        scale: -3

      powerfactor_l1:
        type: register
        address: 70
        dtype: int16
        byte_order: big
        scale: -4             # Rohwert 9800 → 0.9800
      powerfactor_l2:
        type: register
        address: 72
        dtype: int16
        byte_order: big
        scale: -4
      powerfactor_l3:
        type: register
        address: 74
        dtype: int16
        byte_order: big
        scale: -4

      frequency:
        type: register
        address: 76
        dtype: uint16
        byte_order: big
        scale: -2             # Rohwert 5000 → 50.00 Hz

      power_total:
        type: register
        address: 36
        dtype: uint32
        byte_order: big
        word_order: big
        scale: 0
      power_l1:
        type: register
        address: 40
        dtype: uint32
        byte_order: big
        word_order: big
        scale: 0
      power_l2:
        type: register
        address: 44
        dtype: uint32
        byte_order: big
        word_order: big
        scale: 0
      power_l3:
        type: register
        address: 48
        dtype: uint32
        byte_order: big
        word_order: big
        scale: 0

      energy_import:
        type: register
        address: 0
        dtype: uint64
        byte_order: big
        word_order: big
        scale: 0
      energy_export:
        type: register
        address: 8
        dtype: uint64
        byte_order: big
        word_order: big
        scale: 0

  # ---------------------------------------------------------------------------
  # Device 2: Beispiel — TCP-Quelle, fixe Frequenz, berechnete Gesamtleistung
