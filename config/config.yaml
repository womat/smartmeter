debug:
  # log file e.g. /tmp/emu.log | stderr | stdout
  # default: stderr
  file: stderr
  # flag: (default: standard)
  #       trace    >> Warning | Info | Error | Fatal | Debug | Trace
  #       debug    >> Warning | Info | Error | Fatal | Debug
  #       standard >> Warning | Info | Error | Fatal
  # flag: debug
  package:
    main: debug
    mbclient: standatd
    mbserver: standard
    mbgw: standard
    config: standard
    debug: standard
    modbusserver: standard
    framereader: standard
clients:
  # key >> name of device
  #   type: mbclient | mbgateway | fritz!powerline
  #   connection: connectionstring eg: TCP 192.0.2.10:502  DeviceId:1 Timeout:500 (timeout in ms (default 1000ms)
  #   pollingrate: in seconds (default 60) if parameter mode is set to request, the pollingrate can be quite high (eg 300s)
  #   mode: (default polling)
  #         request >> data are updated with each request
  #         polling >> data are updated at the polling rate (parameter pollingrate)
  #   deviceid: [1-247] (default 1) the deviceid is the provided DeviceId by the modbus server
  primarymeter:
    type: mbclient
    connection: TCP 192.0.2.10:502 DeviceId:1 Timeout:100
    pollingrate: 60
    mode: request
    deviceid: 1
    register:
      unknown:
        server: 'Addr:18 Value:285 uint16'
      Device Identifier:
        server: 'Addr:768 Value:117 uint16'
      SerialNumber:
        server: 'Addr:4176 Value:99999999 uint32'
  heatpump:
    type: mbgateway
    connection: HTTP http://raspberryz:8080 Timeout:500
    pollingrate: 60
    mode: request
    deviceid: 2
    register:
      unknown:
        client: 'Addr:18 uint16 quantity:1'
        server: 'Addr:18 uint16'
      Device Identifier:
        client: 'Addr:768 uint16 quantity:1'
        server: 'Addr:768 uint16'
      SerialNumber:
        client: 'Addr:4176 uint16 quantity:2'
        server: 'Addr:4176 uint16'
      Smartmeter Data:
        client: 'Addr:4096 uint16 quantity:64'
        server: 'Addr:4096 uint16'
  dryer:
    type: fritz!powerline
    connection: HTTP http://fritz.box Timeout:500
    pollingrate: 15
    mode: request
    deviceid: 3
    register:
      unknown:
        server: 'Addr:18 Value:285 uint16'
      Device Identifier:
        server: 'Addr:768 Value:117 uint16'
      SerialNumber:
        server: 'Addr:4176 Value:88888888 uint32'
modbusserver:
  #  mode: (default polling)
  #        request >> The current Modbus registers are updated for each request
  #        polling >> for each request, the current Modbus registers are read out without updating the data.
  mode: request
  # connection: connectionstring eg: RTU /dev/ttyS0,9600,8,N,1 Timeout:200 (timeout in ms (default 1000ms)
  #             Timeout: in ms (default 1000ms), Timeout for client response (if client mode = request)
  connection: RTU com3,9600,8,N,1 Timeout:5000
  rs485:
    # the interframedelay defines the silent interval between two data frames im ms and depends on the baudrate
    # there should be a minimum of 3.5char (t3.6) and not less than 1.750ms (= value 2)
    interframedelay: 11
  options:
    rtsctsflowcontrol: false
    intercharactertimeout: 4000
    minimumreadsize: 1
    rs485enable: false
    rs485rtshighduringsend: false
    rs485rtshighaftersend: false
    rs485rxduringtx: false
    rs485delayrtsbeforesend: 0
    rs485delayrtsaftersend: 0
register:
  unknown:
    server: 'Addr:18 Value:285 uint16'
  Device Identifier:
    server: 'Addr:768 Value:117 uint16'
  SerialNumber:
    server: 'Addr:4176 Value:99999999 uint32'
  Current L1:
    client: 'Addr:58 uint32 SF:-3'
    server: 'Addr:4102 uint32 SF:3'
  Current L2:
    client: 'Addr:62 uint32 SF:-3'
    server: 'Addr:4104 uint32 SF:3'
  Current L3:
