# =============================================================================
# app configuration
# =============================================================================

# logLevel defines the minimum log level.
# Messages with at least this level are logged.
# Allowed values: debug | info | warn | error
logLevel: info

# logDestination defines where logs are written to.
# Supported values: stdout | stderr | /path/to/logfile
logDestination: stdout

# environment: dev | prod
env: dev


# =============================================================================
# Webserver configuration (HTTPS)
# =============================================================================
webserver:
  # Host address the HTTPS server listens on (0.0.0.0 = all interfaces)
  listenHost: 0.0.0.0

  # Port the HTTPS server listens on
  listenPort: 8443

  # Global API key for protected endpoints
  apiKey: changeme!

  # TLS private key file
  keyFile: /opt/smartmeteremu/etc/key.pem

  # TLS certificate file
  certFile: /opt/smartmeteremu/etc/cert.pem

  # Blocked IP addresses or networks (empty = none blocked)
  # Examples: 192.168.0.1, 192.168.0.0/16, 10.0.0.0/8
  blockedIPs: []
  #  - 192.168.0.1
  #  - 192.168.0.0/16

  # Allowed IP addresses or networks (empty = all allowed)
  # Note: ::1 is the IPv6 loopback address
  # Examples: 127.0.0.1, ::1, 192.168.0.0/16
  allowedIPs: []
  #  - 127.0.0.1
  #  - ::1
  #  - 192.168.0.0/16
clients:
  # key >> name of device
  #   type: mbclient | mbgateway | fritz!powerline
  #   connection: connectionstring eg: TCP 192.0.2.10:502  DeviceId:1 Timeout:500 (timeout in ms (default 1000ms)
  #   pollingrate: in seconds (default 60) if parameter mode is set to request, the pollingrate can be quite high (eg 300s)
  #   mode: (default polling)
  #         request >> data are updated with each request
  #         polling >> data are updated at the polling rate (parameter pollingrate)
  #   deviceid: [1-247] (default 1)
  primarymeter:
    type: mbclient
    connection: TCP 192.0.2.10:502 DeviceId:1 Timeout:100 MaxRetries:1
    pollingrate: 10
    mode: request
    deviceid: 1
    register:
      unknown:
        server: 'Addr:18 Value:285 uint16'
      Device Identifier:
        server: 'Addr:768 Value:117 uint16'
      SerialNumber:
        server: 'Addr:4176 Value:99999999 uint32'
  heatpump:
    type: mbgateway
    connection: HTTP http://raspberryz:8080 Timeout:500 MaxRetries:1
    pollingrate: 10
    mode: request
    deviceid: 2
    register:
      unknown:
        client: 'Addr:18 uint16 quantity:1'
        server: 'Addr:18 uint16'
      Device Identifier:
        client: 'Addr:768 uint16 quantity:1'
        server: 'Addr:768 uint16'
      SerialNumber:
        client: 'Addr:4176 uint16 quantity:2'
        server: 'Addr:4176 uint16'
      smartmeteremu Data:
        client: 'Addr:4096 uint16 quantity:64'
        server: 'Addr:4096 uint16'
  dryer:
    type: fritz!powerline
    connection: HTTP http://fritz.box Timeout:500
    pollingrate: 15
    mode: request
    deviceid: 3
    register:
      unknown:
        server: 'Addr:18 Value:285 uint16'
      Device Identifier:
        server: 'Addr:768 Value:117 uint16'
      SerialNumber:
        server: 'Addr:4176 Value:88888888 uint32'

modbusserver:
  #  connection: connectionstring eg: RTU /dev/ttyS0,9600,8,N,1 Timeout:200 (timeout in ms (default 1000ms)
  #     Timeout: in ms (default 1000ms), Timeout for client response (if client mode = request)
  connection: RTU com3,9600,8,N,1 Timeout:5000
  options:
    rtsctsflowcontrol: false
    intercharactertimeout: 4000
    minimumreadsize: 1
    rs485enable: false
    rs485rtshighduringsend: false
    rs485rtshighaftersend: false
    rs485rxduringtx: false
    rs485delayrtsbeforesend: 0
    rs485delayrtsaftersend: 0
register:
  unknown:
    server: 'Addr:18 Value:285 uint16'
  Device Identifier:
    server: 'Addr:768 Value:117 uint16'
  SerialNumber:
    server: 'Addr:4176 Value:99999999 uint32'
  Current L1:
    client: 'Addr:58 uint32 SF:-3'
    server: 'Addr:4102 uint32 SF:3'
  Current L2:
    client: 'Addr:62 uint32 SF:-3'
    server: 'Addr:4104 uint32 SF:3'
  Current L3:
    client: 'Addr:66 uint32 SF:-3'
    server: 'Addr:4106 uint32 SF:3'
  Day Energy Smartfox:
    client: 'Addr:32 uint32 SF:0'
  Day Energy from grid:
    client: 'Addr:24 uint32 SF:0'
  Day Energy into grid:
    client: 'Addr:28 uint32 SF:0'
  Energy Smartfox:
    client: 'Addr:16 uint64 SF:0'
  Energy into grid:
    client: 'Addr:8 uint64 SF:0'
    server: 'Addr:4128 uint32 SF:0'
  Energy from grid:
    client: 'Addr:0 uint64 SF:0'
    server: 'Addr:4124 uint32 SF:0'
  Frequeny:
    client: 'Addr:76 uint16 SF:-2'
